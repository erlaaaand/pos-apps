android.builtInKotlin=false
# Kotlin's incremental compiler tries to relativize cache paths between the
# pub cache and the project directory; when they're on different drive
# letters (Windows) that throws "different roots" and fails the build.
# Incremental compilation is a build-speed optimization only, safe to turn
# off — this just makes Kotlin recompile fully each time instead of caching.
kotlin.incremental=false
